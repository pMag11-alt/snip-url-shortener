name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t snip .
      - name: Smoke test
        run: |
          docker run -d --name snip -p 8000:8000 snip
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          code=$(curl -fs -X POST localhost:8000/api/links -H 'content-type: application/json' \
            -d '{"url":"https://github.com"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/$code)" = "302"
